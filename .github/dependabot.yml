# Bağımlılık ve iş akışı güncellemelerini otomatik PR olarak açar (tedarik zinciri koruması).
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
