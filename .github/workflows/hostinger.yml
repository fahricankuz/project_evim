name: Hostinger paketi

# Hostinger için hazır site paketini üretir:
#  1) `hostinger` dalına derlenmiş siteyi yazar (Hostinger'ın Git özelliği bu dalı public_html'e çeker),
#  2) aynı dosyaları `kiracim-hostinger.zip` olarak indirilebilir paket (artifact) bırakır.
# Varsayılan dala her push'ta ve elle (Actions → Hostinger paketi → Run workflow) çalışır.
# Değişkenler pages.yml ile aynıdır: SUPABASE_URL, SUPABASE_ANON_KEY (zorunlu), TURNSTILE_SITE_KEY (isteğe bağlı).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Paketleri kur
        working-directory: app
        run: npm ci
      - name: Tür denetimi
        working-directory: app
        run: npx tsc --noEmit
      - name: Siteyi derle ve sertleştir
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build:hostinger
      - name: Zip paketi
        run: |
          cd hostinger-site
          zip -qr ../kiracim-hostinger.zip . -x '.git/*'
          ls -la ..
      - uses: actions/upload-artifact@v4
        with:
          name: kiracim-hostinger
          path: kiracim-hostinger.zip
          retention-days: 30
      - name: hostinger dalına yaz (Hostinger Git dağıtımı bu dalı çeker)
        run: |
          cd hostinger-site
          git init -q -b hostinger
          git config user.name "kiracim-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Hostinger derlemesi ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hostinger
